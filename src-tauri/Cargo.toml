[workspace]
members = ["service-host"]

[package]
name = "singboard"
version = "4.0.0"
edition = "2024"
default-run = "singboard"

[lib]
name = "singboard_lib"
crate-type = ["lib"]

[[bin]]
name = "singboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "time", "sync", "fs", "io-util", "net"] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Environment",
] }
winreg = "0.55"
singboard-service = { path = "service-host" }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.6.0"
sha2 = "0.10"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
