[package]
name = "singboard-stream"
version = "4.9.2"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
flate2 = "1"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
semver = "1"
sha2 = "0.10"
jsonc-parser = { version = "0.34", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros","fs","io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
tar = { version = "0.4", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
hickory-resolver = { version = "0.26", features = ["tokio","system-config"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
tokio = { version = "1", features = ["process"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(singboard_tauri)"] }
