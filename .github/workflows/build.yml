name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  android-signing:
    name: Check Android signing
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret $name; skipping Android APKs because release APKs must be signed with the same key to update in place"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Read release tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0
          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            throw "No tag found in the repository; push a tag before building"
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$($tag -replace '^v', '')" >> $env:GITHUB_ENV

      - name: Import code signing certificate
        if: env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath

          # Trust the self-signed cert on this ephemeral runner so that
          # "signtool verify /pa" can validate the certificate chain.
          $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $rootStore.Open("ReadWrite")
          $rootStore.Add($cert)
          $rootStore.Close()

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build and sign service host
        if: env.CERT_THUMBPRINT != ''
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release -p singboard-service
          & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com target/release/singboard-service.exe
          if ($LASTEXITCODE -ne 0) { throw "signing singboard-service.exe failed" }

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Sign application
        if: env.CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          # The service host was signed before being embedded; fail loudly if
          # the Tauri build relinked it and wiped the signature.
          & $env:SIGNTOOL verify /pa src-tauri/target/release/singboard.service
          if ($LASTEXITCODE -ne 0) { throw "singboard.service lost its signature during the Tauri build" }

          $files = @(Get-Item src-tauri/target/release/singboard.exe)
          $files += Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.exe, *.msi -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($f.Name) failed" }
            & $env:SIGNTOOL verify /pa $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($f.Name)" }
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: src-tauri/target/release/singboard.exe
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android ${{ matrix.abi }}
    needs: android-signing
    if: needs.android-signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64
            rust-target: aarch64-linux-android
            flavor: arm64
          - abi: armeabi-v7a
            target: armv7
            rust-target: armv7-linux-androideabi
            flavor: arm
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0) || { echo "No tag found in the repository; push a tag before building"; exit 1; }
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          add-job-summary: never

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r30
          local-cache: true

      - name: Export NDK path
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}
          env-vars: NDK_HOME
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write signing config
        working-directory: src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          pnpm tauri android build --apk --split-per-abi --target ${{ matrix.target }} --config "{\"version\":\"$APP_VERSION\"}"

      - name: Collect APK
        run: |
          mkdir -p release
          cp "src-tauri/gen/android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk" "release/singboard-${{ matrix.abi }}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/singboard-${{ matrix.abi }}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/release.jks src-tauri/gen/android/keystore.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: release/singboard-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [build-windows, build-android]
    if: always() && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Download build outputs
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Set build time
        run: echo "DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') UTC+8" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_VERSION }}
          body: |
            Build time: ${{ env.DATE }}
          files: |
            release/singboard.exe
            release/*.apk
