name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v5.1.2; defaults to tag on HEAD)
        required: false
        type: string
      allow_overwrite:
        description: Allow overwriting an existing GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
      android_signing_available: ${{ steps.signing.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "Tag not found: $tag"; exit 1; }
          else
            tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
            if [ -z "$tag" ]; then
              echo "HEAD has no v* tag; pass inputs.tag or push a tag before building"
              exit 1
            fi
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "Release version must use major.minor.patch with minor and patch below 100: $version"
            exit 1
          fi
          if [ "$ALLOW_OVERWRITE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$((10000 * 10#$major + 100 * 10#$minor + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret $name; skipping Android APKs because release APKs must be signed with the same key to update in place"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows app
    needs: prepare
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore source file timestamps
        shell: pwsh
        run: |
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $ts = 0L
          foreach ($line in (git -c core.quotepath=false log --format="@%ct" --name-only -- Cargo.toml crates apps/windows)) {
            if ($line.StartsWith("@")) {
              $ts = [long]$line.Substring(1)
            } elseif ($line -and $seen.Add($line) -and (Test-Path -LiteralPath $line -PathType Leaf)) {
              [IO.File]::SetLastWriteTimeUtc((Resolve-Path -LiteralPath $line).Path, [DateTimeOffset]::FromUnixTimeSeconds($ts).UtcDateTime)
            }
          }

      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:RUNNER_TEMP
          } catch {
            Write-Warning "Failed to configure Windows Defender exclusions: $_"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure Rust linker
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $lld = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe"
          if (Test-Path -LiteralPath $lld) {
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" >> $env:GITHUB_ENV
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-Ctarget-feature=+crt-static -Clinker-flavor=lld-link" >> $env:GITHUB_ENV
          } else {
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-Ctarget-feature=+crt-static" >> $env:GITHUB_ENV
          }

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: x86_64-pc-windows-msvc-v2
          env-vars: CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Import code signing certificate
        if: env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $rootStore.Open("ReadWrite")
          try {
            $rootStore.Add($cert)
          } finally {
            $rootStore.Close()
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build service host
        shell: pwsh
        run: |
          cargo build --locked --profile windows-release --target x86_64-pc-windows-msvc -p singboard-service
          if ($LASTEXITCODE -ne 0) { throw "building singboard-service.exe failed" }
          $hostExe = Join-Path $env:RUNNER_TEMP "singboard-service.exe"
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/windows-release/singboard-service.exe -Destination $hostExe -Force
          if ($env:CERT_THUMBPRINT) {
            & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $hostExe
            if ($LASTEXITCODE -ne 0) { throw "signing singboard-service.exe failed" }
          }
          "SINGBOARD_SERVICE_HOST=$hostExe" >> $env:GITHUB_ENV

      - name: Build Windows app
        shell: pwsh
        run: |
          $env:SINGBOARD_RELEASE_VERSION = $env:APP_VERSION
          cargo build --locked --profile windows-release --target x86_64-pc-windows-msvc -p singboard-gpui
          if ($LASTEXITCODE -ne 0) { throw "building singboard.exe failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/windows-release/singboard.exe -Destination release/singboard-windows-x64.exe

      - name: Sign application
        if: env.CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $serviceHost = Get-Item $env:SINGBOARD_SERVICE_HOST
          & $env:SIGNTOOL verify /pa $serviceHost.FullName
          if ($LASTEXITCODE -ne 0) { throw "singboard-service.exe lost its signature during the build" }
          $hostHash = (Get-FileHash $serviceHost.FullName -Algorithm SHA256).Hash
          $embedded = Get-ChildItem target/x86_64-pc-windows-msvc/windows-release/build -Recurse -File -Filter singboard.service |
            Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $hostHash }
          if (-not $embedded) { throw "no embedded singboard.service matches the signed singboard-service.exe" }

          $exe = Get-Item release/singboard-windows-x64.exe
          & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing $($exe.Name) failed" }
          & $env:SIGNTOOL verify /pa $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($exe.Name)" }

      - name: Upload Windows app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: release/singboard-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Remove code signing certificate
        if: always() && env.CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          Remove-Item -Path "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "Cert:\LocalMachine\Root\$env:CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue

  build-android:
    name: Build Android ${{ matrix.abi }}
    needs: prepare
    if: needs.prepare.outputs.android_signing_available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            clang: aarch64-linux-android
            flutter-platform: android-arm64
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi
            flutter-platform: android-arm
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('apps/android/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.abi }}-
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/28.* "$ANDROID_HOME"/ndk/29.* "$ANDROID_HOME"/ndk/30.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
            ndk="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          test -f "$ndk/source.properties" || { echo "NDK not found at $ndk"; exit 1; }
          grep Pkg.Revision "$ndk/source.properties"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.rust-target }}
          env-vars: NDK_HOME
          cache-on-failure: true

      - name: Build Rust core library
        run: |
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          compiler="$bin/${{ matrix.clang }}26-clang"
          key=$(echo "${{ matrix.rust-target }}" | tr '-' '_')
          key_upper=$(echo "$key" | tr '[:lower:]' '[:upper:]')
          export "CARGO_TARGET_${key_upper}_LINKER=$compiler"
          export "CC_${key}=$compiler"
          export "AR_${key}=$bin/llvm-ar"
          export SINGBOARD_RELEASE_VERSION="$APP_VERSION"
          cargo build --locked --release -p singboard-core --target "${{ matrix.rust-target }}"

      - name: Build and sign APK
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          DART_SUPPRESS_ANALYTICS: "true"
        run: |
          stage="$RUNNER_TEMP/android-app"
          rm -rf "$stage"
          flutter create --no-pub --empty --platforms=android --org io.github.yuu518 --project-name singboard_native "$stage"
          cp apps/android/pubspec.yaml apps/android/pubspec.lock "$stage/"
          cp apps/android/lib/*.dart "$stage/lib/"
          cp -r apps/android/assets "$stage/"
          cp apps/android/host/AndroidManifest.xml "$stage/android/app/src/main/"
          mkdir -p "$stage/android/app/src/main/res/xml"
          cp apps/android/host/update_paths.xml "$stage/android/app/src/main/res/xml/"
          rm -rf "$stage/android/app/src/main/kotlin"
          mkdir -p "$stage/android/app/src/main/kotlin/io/github/Yuu518/singboard"
          cp apps/android/host/*.kt "$stage/android/app/src/main/kotlin/io/github/Yuu518/singboard/"
          rm -rf "$stage/android/app/src/main/res/mipmap-anydpi-v26"
          cp -r apps/android/host/res/. "$stage/android/app/src/main/res/"
          ndk_version=$(basename "$NDK_HOME")
          sed -i -E "s/namespace = \"[^\"]+\"/namespace = \"io.github.Yuu518.singboard\"/; s/applicationId = \"[^\"]+\"/applicationId = \"io.github.Yuu518.singboard\"/; s/minSdk = flutter\.minSdkVersion/minSdk = 26/; s/ndkVersion = flutter\.ndkVersion/ndkVersion = \"$ndk_version\"/" "$stage/android/app/build.gradle.kts"
          grep -q 'namespace = "io.github.Yuu518.singboard"' "$stage/android/app/build.gradle.kts"
          grep -q 'applicationId = "io.github.Yuu518.singboard"' "$stage/android/app/build.gradle.kts"
          grep -q 'minSdk = 26' "$stage/android/app/build.gradle.kts"
          mkdir -p "$stage/android/app/src/main/jniLibs/${{ matrix.abi }}"
          cp "target/${{ matrix.rust-target }}/release/libsingboard_core.so" "$stage/android/app/src/main/jniLibs/${{ matrix.abi }}/"

          (
            cd "$stage"
            flutter pub get
            flutter analyze --no-pub lib
            flutter build apk --release --no-pub --split-per-abi --target-platform "${{ matrix.flutter-platform }}" --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
          )

          mkdir -p release
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "release/singboard-${{ matrix.abi }}.apk" \
            "$stage/build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/singboard-${{ matrix.abi }}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: release/singboard-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [prepare, build-windows, build-android]
    if: always() && needs.prepare.result == 'success' && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release does not exist
        if: ${{ !inputs.allow_overwrite }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite"
            exit 1
          fi

      - name: Download build outputs
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Write release notes
        run: |
          git log -1 --format=%b "$RELEASE_TAG" |
            awk '/^ +[^ ]/ && buf != "" { sub(/^ +/, " "); buf = buf $0; next } NR > 1 { print buf } { buf = $0 } END { if (NR) print buf }' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            prev=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$RELEASE_TAG^" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/singboard-windows-x64.exe
            release/singboard-*.apk
