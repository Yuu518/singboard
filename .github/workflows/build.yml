name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  android-signing:
    name: Check Android signing
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret $name; skipping Android APKs because release APKs must be signed with the same key to update in place"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: clients/native -> target
          cache-on-failure: true

      - name: Read release tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0
          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            throw "No tag found in the repository; push a tag before building"
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$($tag -replace '^v', '')" >> $env:GITHUB_ENV

      - name: Import code signing certificate
        if: env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath

          $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $rootStore.Open("ReadWrite")
          $rootStore.Add($cert)
          $rootStore.Close()

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build service host
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-Ctarget-feature=+crt-static'
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path clients/native/Cargo.toml -p singboard-service
          if ($LASTEXITCODE -ne 0) { throw "building singboard-service.exe failed" }
          if ($env:CERT_THUMBPRINT) {
            & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com clients/native/target/x86_64-pc-windows-msvc/release/singboard-service.exe
            if ($LASTEXITCODE -ne 0) { throw "signing singboard-service.exe failed" }
          }

      - name: Build Windows app
        shell: pwsh
        run: |
          $env:SINGBOARD_RELEASE_VERSION = $env:APP_VERSION
          $env:SINGBOARD_SERVICE_HOST = (Resolve-Path clients/native/target/x86_64-pc-windows-msvc/release/singboard-service.exe).Path
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-Ctarget-feature=+crt-static'
          cargo build --locked --profile windows-release --target x86_64-pc-windows-msvc --manifest-path clients/native/Cargo.toml -p singboard-gpui
          if ($LASTEXITCODE -ne 0) { throw "building singboard.exe failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -LiteralPath clients/native/target/x86_64-pc-windows-msvc/windows-release/singboard.exe -Destination release/singboard-native-windows-x64.exe

      - name: Sign application
        if: env.CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $serviceHost = Get-Item clients/native/target/x86_64-pc-windows-msvc/release/singboard-service.exe
          & $env:SIGNTOOL verify /pa $serviceHost.FullName
          if ($LASTEXITCODE -ne 0) { throw "singboard-service.exe lost its signature during the build" }
          $hostHash = (Get-FileHash $serviceHost.FullName -Algorithm SHA256).Hash
          $embedded = Get-ChildItem clients/native/target/x86_64-pc-windows-msvc/windows-release/build -Recurse -File -Filter singboard.service |
            Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $hostHash }
          if (-not $embedded) { throw "no embedded singboard.service matches the signed singboard-service.exe" }

          $exe = Get-Item release/singboard-native-windows-x64.exe
          & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing $($exe.Name) failed" }
          & $env:SIGNTOOL verify /pa $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($exe.Name)" }

      - name: Upload Windows app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: release/singboard-native-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android ${{ matrix.abi }}
    needs: android-signing
    if: needs.android-signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            clang: aarch64-linux-android
            flutter-platform: android-arm64
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi
            flutter-platform: android-arm
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0) || { echo "No tag found in the repository; push a tag before building"; exit 1; }
          version="${tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((10000 * major + 100 * minor + patch))" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          add-job-summary: never

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/28.* "$ANDROID_HOME"/ndk/30.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
            ndk="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          test -f "$ndk/source.properties" || { echo "NDK not found at $ndk"; exit 1; }
          grep Pkg.Revision "$ndk/source.properties"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: clients/native -> target
          key: ${{ matrix.rust-target }}
          env-vars: NDK_HOME
          cache-on-failure: true

      - name: Build Rust stream library
        run: |
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          compiler="$bin/${{ matrix.clang }}26-clang"
          key=$(echo "${{ matrix.rust-target }}" | tr '-' '_')
          key_upper=$(echo "$key" | tr '[:lower:]' '[:upper:]')
          export "CARGO_TARGET_${key_upper}_LINKER=$compiler"
          export "CC_${key}=$compiler"
          export "AR_${key}=$bin/llvm-ar"
          export SINGBOARD_RELEASE_VERSION="$APP_VERSION"
          cargo build --locked --release --manifest-path clients/native/Cargo.toml -p singboard-stream --target "${{ matrix.rust-target }}"

      - name: Build and sign APK
        run: |
          stage="$RUNNER_TEMP/android-app"
          flutter create --no-pub --empty --platforms=android --org io.github.yuu518 --project-name singboard_native "$stage"
          cp clients/native/android/pubspec.yaml clients/native/android/pubspec.lock "$stage/"
          cp clients/native/android/lib/*.dart "$stage/lib/"
          cp -r clients/native/android/assets "$stage/"
          cp clients/native/android/AndroidManifest.xml "$stage/android/app/src/main/"
          mkdir -p "$stage/android/app/src/main/res/xml"
          cp clients/native/android/update_paths.xml "$stage/android/app/src/main/res/xml/"
          cp clients/native/android/MainActivity.kt "$stage/android/app/src/main/kotlin/io/github/yuu518/singboard_native/MainActivity.kt"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "clients/native/android/res/mipmap-$density/ic_launcher.png" "$stage/android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$stage/android/app/build.gradle.kts"
          mkdir -p "$stage/android/app/src/main/jniLibs/${{ matrix.abi }}"
          cp "clients/native/target/${{ matrix.rust-target }}/release/libsingboard_stream.so" "$stage/android/app/src/main/jniLibs/${{ matrix.abi }}/"

          (
            cd "$stage"
            flutter pub get
            flutter analyze --no-pub lib
            flutter build apk --release --no-pub --split-per-abi --target-platform "${{ matrix.flutter-platform }}" --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"
          )

          mkdir -p release
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "release/singboard-native-${{ matrix.abi }}.apk" \
            "$stage/build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/singboard-native-${{ matrix.abi }}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: release/singboard-native-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [build-windows, build-android]
    if: always() && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Download build outputs
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Write release notes
        run: |
          git log -1 --format=%b "$RELEASE_TAG" |
            awk '/^ +[^ ]/ && buf != "" { sub(/^ +/, " "); buf = buf $0; next } NR > 1 { print buf } { buf = $0 } END { if (NR) print buf }' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            prev=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$RELEASE_TAG^" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/singboard-native-windows-x64.exe
            release/singboard-native-*.apk
