name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        shell: pwsh
        run: |
          $metadata = cargo metadata `
            --manifest-path src-tauri/Cargo.toml `
            --no-deps `
            --format-version 1 | ConvertFrom-Json
          $app = $metadata.packages |
            Where-Object { $_.name -eq "singboard" } |
            Select-Object -First 1

          if (-not $app) {
            throw "Could not find the singboard package in Cargo metadata"
          }

          "APP_VERSION=$($app.version)" >> $env:GITHUB_ENV

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ${{ env.APP_VERSION }}
          files: |
            src-tauri/target/release/singboard.exe
            src-tauri/target/release/bundle/**/*
