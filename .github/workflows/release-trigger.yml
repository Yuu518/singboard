name: Trigger Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch release build
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and dispatch build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "Release version must use major.minor.patch with minor and patch below 100: $version"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "${DEFAULT_BRANCH:-master}" -f tag="$TAG"
