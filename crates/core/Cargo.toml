[package]
name = "singboard-core"
version = "5.0.7"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
flate2 = "1"
semver = "1"
sha2 = "0.10"
jsonc-parser = { version = "0.34", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros","fs","io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
url = "2"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
tar = { version = "0.4", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tonic = { version = "0.14", default-features = false, features = ["tls-native-roots"] }
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
tokio = { version = "1", features = ["process"] }
